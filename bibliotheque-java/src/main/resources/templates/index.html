<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Bibliothèque</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Mini Bibliothèque</h1><p>Gestion simple des livres et emprunts</p></header><main><div th:if="${message}" class="notice success" th:text="${message}"></div><section class="stats"><div><strong th:text="${stats.livres}"></strong><span>Livres</span></div><div><strong th:text="${stats.exemplaires}"></strong><span>Exemplaires</span></div><div><strong th:text="${stats.emprunts}"></strong><span>Emprunts en cours</span></div></section><section class="grid"><form method="post" action="/books"><h2>Ajouter un livre</h2><input name="titre" placeholder="Titre" required><input name="auteur" placeholder="Auteur" required><input name="categorie" placeholder="Catégorie"><input name="quantite" type="number" min="1" placeholder="Quantité" required><button>Ajouter</button></form><form method="post" action="/borrowers"><h2>Enregistrer un emprunteur</h2><input name="nom" placeholder="Nom" required><input name="telephone" placeholder="Téléphone" required><button>Enregistrer</button></form><form method="post" action="/loans"><h2>Nouvel emprunt</h2><select name="livre_id" required><option value="">Livre</option><option th:each="b:${books}" th:if="${b.disponibles>0}" th:value="${b.id}" th:text="${b.titre+' ('+b.disponibles+')'}"></option></select><select name="emprunteur_id" required><option value="">Emprunteur</option><option th:each="b:${borrowers}" th:value="${b.id}" th:text="${b.nom}"></option></select><button>Emprunter</button></form></section><section><form class="search"><input name="q" th:value="${query}" placeholder="Rechercher un titre ou auteur"><button>Rechercher</button></form><h2>Livres</h2><div class="table-wrap"><table><tr><th>Titre</th><th>Auteur</th><th>Catégorie</th><th>Disponibles</th></tr><tr th:each="b:${books}"><td th:text="${b.titre}"></td><td th:text="${b.auteur}"></td><td th:text="${b.categorie}"></td><td th:text="${b.disponibles+'/'+b.quantite}"></td></tr></table></div></section><section><h2>Modifier ou supprimer un livre</h2><div th:each="b:${books}" class="inline"><form method="post" th:action="@{'/books/'+${b.id}+'/edit'}"><input name="titre" th:value="${b.titre}" required><input name="auteur" th:value="${b.auteur}" required><input name="categorie" th:value="${b.categorie}"><input name="quantite" type="number" min="1" th:value="${b.quantite}" required><button>Modifier</button></form><form method="post" th:action="@{'/books/'+${b.id}+'/delete'}"><button>Supprimer</button></form></div></section><section><h2>Emprunts</h2><div class="table-wrap"><table><tr><th>Livre</th><th>Emprunteur</th><th>Statut</th><th>Action</th></tr><tr th:each="l:${loans}"><td th:text="${l.titre}"></td><td th:text="${l.emprunteur}"></td><td th:text="${l.statut}"></td><td><form th:if="${l.statut=='en_cours'}" method="post" th:action="@{'/loans/'+${l.id}+'/return'}"><button>Retourner</button></form><span th:unless="${l.statut=='en_cours'}" th:text="${l.date_retour}"></span></td></tr></table></div></section></main></body></html>
